spring.application.name=mcpclient

server.port=8081


logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

##############################################
# OPENAI CONFIGURATION
##############################################
#Docker container running Gemma3 on localhost:12434
spring.ai.openai.base-url=http://localhost:12434/v1
spring.ai.openai.api-key=dummy
spring.ai.openai.chat.model=ai/qwen3
spring.ai.openai.embedding.model=ai/nomic-embed-text-v1.5
spring.ai.openai.chat.enabled=true
spring.ai.openai.embedding.enabled=true


#For MCP StdIO Client
#spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers-stdio-configuration.json

#For MCP Streamable Remote Client
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers-configuration.json
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.streamable-http.connections.vibhu.url=http://localhost:8083
spring.ai.mcp.client.streamable-http.connections.vibhu.endpoint=/mcp